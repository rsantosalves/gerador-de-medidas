<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caça-Medidas — Futebol de Mesa</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f7f3e8;background:#0b2520}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.machine{width:min(100%,520px);background:linear-gradient(145deg,#17483c,#09251f);border:4px solid #d6ae57;border-radius:25px;padding:25px 18px;box-shadow:0 20px 55px #0008;text-align:center}h1{color:#ffd47a;margin:0;font-size:clamp(1.7rem,6vw,2.5rem)}.sub{letter-spacing:.17em;color:#b9d5c8;font-size:.7rem;margin:8px 0 28px}.reels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.label{color:#ffdf96;font-weight:800;font-size:.78rem;letter-spacing:.04em;margin-bottom:9px}.reel{height:126px;background:#f6f3e8;color:#183b32;border:3px solid #c6a357;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 0 18px #0002}.number{font-weight:900;font-size:clamp(2rem,9vw,3.3rem);font-variant-numeric:tabular-nums}.unit{color:#60776e;font-size:.85rem}.reel.spinning .number{filter:blur(2px)}button{margin-top:25px;border:0;border-radius:13px;background:linear-gradient(#ffdc81,#e9a93d);color:#233329;font-size:1.25rem;font-weight:900;padding:17px 30px;width:100%;cursor:pointer;box-shadow:0 5px 0 #9b6923}button:active{transform:translateY(3px);box-shadow:0 2px 0 #9b6923}button:disabled{opacity:.7;cursor:wait}.result{min-height:25px;color:#d3e7dc;margin-top:22px}.foot{font-size:.73rem;color:#a8c8b8;margin-top:19px} @media(prefers-reduced-motion:reduce){.reel.spinning .number{filter:none}}</style></head><body><main class="machine"><h1>🎰 CAÇA-MEDIDAS</h1><div class="sub">FUTEBOL DE MESA</div><div class="reels"><section><div class="label">ALTURA</div><div class="reel"><span class="number" id="height">4,7</span><span class="unit">mm</span></div></section><section><div class="label">GRAU</div><div class="reel"><span class="number" id="degree">21</span><span class="unit">°</span></div></section><section><div class="label">CAVA</div><div class="reel"><span class="number" id="cavity">1,1</span><span class="unit">mm</span></div></section></div><button id="spin">🎲 GIRAR!</button><div class="result" id="result" aria-live="polite">Pronto para sortear!</div><div class="foot">Altura: 3,9–5,5 mm · Grau: 16–26° · Cava: 0,3–2,0 mm</div></main><script>const ranges=[[39,55],[16,26],[3,20]],ids=['height','degree','cavity'];const button=document.getElementById('spin'),result=document.getElementById('result');const randomInt=(a,b)=>{const n=b-a+1;const arr=new Uint32Array(1);const limit=Math.floor(4294967296/n)*n;let x;do{crypto.getRandomValues(arr);x=arr[0]}while(x>=limit);return a+(x%n)};const format=(n,i)=>i===1?String(n):(n/10).toFixed(1).replace('.',',');button.addEventListener('click',()=>{button.disabled=true;result.textContent='Girando os roletes...';const final=ranges.map(([a,b])=>randomInt(a,b));ids.forEach((id,i)=>{const el=document.getElementById(id),reel=el.parentElement;reel.classList.add('spinning');const timer=setInterval(()=>{el.textContent=format(randomInt(...ranges[i]),i)},55);setTimeout(()=>{clearInterval(timer);el.textContent=format(final[i],i);reel.classList.remove('spinning');if(i===2){button.disabled=false;result.textContent=`🎉 Altura ${format(final[0],0)} mm · Grau ${final[1]}° · Cava ${format(final[2],2)} mm`}},1100+i*650)})});</script></body></html>
